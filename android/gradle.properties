# -Duser.language/-Duser.country pin the Gradle JVM to a Latin-digit locale.
# On an ar-SA machine the CLDR provider makes Arabic-Indic the default
# numbering system, so AGP formats the multidex index as 'classes٢.dex'
# and packageReleaseBundle fails looking for a file named 'classes2.dex'.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
