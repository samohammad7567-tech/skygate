name: skygate
description: "Sky Gate — بوابة السماء travel & Umrah app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # state management
  flutter_bloc: ^9.1.1
  buildcondition: ^0.0.4

  # networking
  dio: ^5.7.0

  # localization
  easy_localization: ^3.0.7
  intl: any

  # storage
  shared_preferences: ^2.3.3

  # media
  image_picker: ^1.2.3

  # ui
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lang/
    - assets/images/
    - assets/images/onboarding/
    # Splash entry screen backgrounds.
    - assets/images/splash/png/
    # Auth / signup exports.
    - assets/images/auth/
    - assets/images/auth/png/
    - assets/images/auth/svgs/
    # Home screen exports (hero photography, service illustrations, glyphs).
    - assets/images/home/
    - assets/images/home/svgs/
    # Figma export: section "قسم تسجيل الدخول و انشاء حساب جديد" (node 1:3335).
    # Flutter does not recurse into subfolders, so each one is listed.
    - assets/images/firstsection/photos/
    - assets/images/firstsection/illustrations/
    - assets/images/firstsection/icons/
    - assets/images/firstsection/decor/
    # Figma export: "تفاصيل الرحلة" flow (package, itinerary, hotels,
    # activities, offers). Glyphs are SVG, photography and logos are PNG.
    - assets/images/journy_details/
    - assets/images/journy_details/png/
