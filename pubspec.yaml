name: skygate
description: "Sky Gate — بوابة السماء travel & Umrah app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  buildcondition: ^0.0.4
  get: ^4.7.2
  dio: ^5.8.0+1
  http: ^1.3.0
  easy_localization: ^3.0.7+1
  intl: any
  shared_preferences: ^2.3.3
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.5
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^17.0.0
  image_picker: ^1.2.3
  file_picker: ^10.3.6
  video_player: ^2.9.5
  audioplayers: ^6.4.0
  google_maps_flutter: ^2.12.1
  google_maps_widget: ^1.0.6
  map_picker: ^0.0.3
  location: ^8.0.0
  permission_handler: ^11.3.1
  local_auth: ^2.3.0
  mrz_scanner_plus: ^0.0.6
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  flutter_svg_provider: ^1.0.7
  gap: ^3.0.1
  flutter_screenutil: ^5.9.3
  carousel_slider: ^5.0.0
  flutter_expanded_tile: ^0.4.0
  font_awesome_flutter: ^11.0.0
  loading_animation_widget: ^1.3.0
  toastification: ^3.0.1
  formz: ^0.7.0
  datetime_picker_formfield_new: ^2.1.0
  intl_phone_field: ^3.2.0
  mask_text_input_formatter: ^2.9.0
  dartz: ^0.10.1
  simple_logger: ^1.10.0
  http_parser: ^4.1.2
  timezone: ^0.9.4
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lang/
    - assets/images/svgs/
    - assets/images/pngs/
    - assets/images/jpgs/
    - assets/videos/
    - assets/sounds/

  fonts:
    - family: Hacen
      fonts:
        - asset: assets/fonts/HacenSaudiArabia.ttf
    - family: Aileron
      fonts:
        - asset: assets/fonts/Aileron.ttf
