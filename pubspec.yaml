name: skygate
description: "Sky Gate — بوابة السماء travel & Umrah app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # state management
  flutter_bloc: ^9.1.1
  buildcondition: ^0.0.4

  # networking
  dio: ^5.7.0

  # localization
  easy_localization: ^3.0.7
  intl: any

  # storage
  shared_preferences: ^2.3.3

  # media
  image_picker: ^1.2.3

  # ui
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lang/
    # Every image lives in one flat folder per file type; the registries
    # in lib/core/constants give them their names.
    - assets/images/svgs/
    - assets/images/pngs/
    - assets/images/jpgs/
